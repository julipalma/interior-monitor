name: Interior monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .state
          key: interior-monitor-state-${{ runner.os }}-v1
          restore-keys: |
            interior-monitor-state-${{ runner.os }}-
            interior-state-

      - name: Ejecutar monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATE_DIR: .state
          MAX_DEEP_INSPECT: "500"
        run: npm run start
