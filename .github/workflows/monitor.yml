name: Interior monitor

on:
  schedule:
    # Cada 10 min. Solo corre en la rama por defecto (main).
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Una corrida por rama a la vez: evita dos pushes del mismo estado en paralelo.
concurrency:
  group: interior-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Ejecutar monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATE_DIR: monitor-state
          MAX_DEEP_INSPECT: "500"
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        run: npm run start

      - name: Persistir estado en el repositorio
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-state/ public/
          if git diff --staged --quiet; then
            echo "Sin cambios en monitor-state"
            exit 0
          fi
          git commit -m "chore(monitor): persistir estado visto [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
